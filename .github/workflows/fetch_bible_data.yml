name: Fetch Bible Reference Data

# Refreshes the static Bible-reference snapshot in assets/data/bible/ from the
# sermon API. The primary refresh now runs from the local ingest in the
# sermon-library repository (bin/run_ingest.sh); this workflow is the backup
# path. GitHub disables scheduled workflows in repositories without recent
# activity, so re-enable it from the Actions tab if you rely on it.
#
# Safety: scripts/fetch_bible_data.py writes nothing and exits non-zero unless
# it fetched and validated a complete snapshot, so a failed or partial fetch
# fails this job instead of committing a mix of old and new files.

on:
  schedule:
    # Once a day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Accept a snapshot smaller than the current one (skips the shrink guard)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: fetch-bible-data
  cancel-in-progress: false

jobs:
  fetch-bible-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and validate a complete snapshot
        env:
          API_URL: ${{ secrets.API_URL || 'https://sermon-search-api-8fok.onrender.com' }}
          FETCH_ALLOW_SHRINK: ${{ github.event.inputs.force_refresh || 'false' }}
        run: python scripts/fetch_bible_data.py

      - name: Commit and push the snapshot
        run: |
          bash scripts/commit_data_snapshot.sh assets/data/bible \
            "Update Bible reference data: $(date -u +%Y-%m-%d) [skip ci]"

      - name: Report snapshot freshness
        if: always()
        run: |
          {
            echo "### Bible reference snapshot"
            if [ -f assets/data/bible/manifest.json ]; then
              echo '```json'
              cat assets/data/bible/manifest.json
              echo
              echo '```'
            else
              echo "No manifest.json present."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
